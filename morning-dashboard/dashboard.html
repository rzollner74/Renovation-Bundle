<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌅 Morning Dashboard</title>
  <style>
    :root {
      /* Coffee-morning, light & airy palette */
      --bg: #f6f1e9;
      --bg-grad-1: #fbf7f0;
      --bg-grad-2: #f1e9dc;
      --card: #ffffff;
      --card-soft: #fcf9f4;

      --ink: #2f2a25;        /* espresso headings */
      --ink-soft: #6f665b;   /* muted text */
      --muted: #a59a8b;      /* captions */
      --line: #ece3d6;       /* soft borders */

      --accent: #e8722e;     /* vibrant morning orange */
      --accent-deep: #d65f1c;
      --accent-soft: #fbe7d8;
      --gold: #f2a65a;
      --sage: #7d9b76;       /* on-track green */
      --rose: #e07a5f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
        'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    .app {
      min-height: 100vh;
      padding: 48px 40px 64px;
      background:
        radial-gradient(900px 500px at 88% -8%, rgba(242,166,90,0.18), transparent 60%),
        radial-gradient(800px 480px at -6% 12%, rgba(125,155,118,0.12), transparent 55%),
        linear-gradient(170deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    }

    .dashboard { max-width: 1280px; margin: 0 auto; }

    /* Header */
    .header { margin-bottom: 14px; }
    .header h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    .timestamp { font-size: 0.98rem; color: var(--ink-soft); margin-top: 2px; }

    /* Quote banner */
    .quote-card {
      margin: 22px 0 34px;
      background: linear-gradient(135deg, #ffffff, var(--card-soft));
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: 16px;
      padding: 22px 28px;
      box-shadow: 0 8px 24px rgba(47,42,37,0.05);
    }
    .quote-text { font-size: 1.25rem; font-weight: 600; color: var(--ink); }
    .quote-author { font-size: 0.95rem; color: var(--muted); font-style: italic; margin-top: 6px; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 26px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 10px 30px rgba(47,42,37,0.05);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 38px rgba(47,42,37,0.09);
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
    }
    .span-all { grid-column: 1 / -1; }

    /* Generic metric row */
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .metric:last-child { border-bottom: none; }
    .label { font-size: 0.95rem; color: var(--ink-soft); font-weight: 500; }
    .value { font-size: 1.2rem; font-weight: 700; color: var(--ink); }
    .value.small { font-size: 0.95rem; font-weight: 600; }
    .accent { color: var(--accent); }

    /* Weather hero (orange) */
    .weather-card {
      background: linear-gradient(155deg, #f2843c 0%, var(--accent-deep) 100%);
      border: none;
      color: #fff;
    }
    .weather-card h2 { color: #fff; }
    .weather .temp { font-size: 3.4rem; font-weight: 800; line-height: 1.05; margin: 6px 0 2px; }
    .weather .condition { font-size: 1.15rem; color: rgba(255,255,255,0.92); margin-bottom: 16px; }
    .weather .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .weather .details p { font-size: 0.85rem; color: rgba(255,255,255,0.88); }
    .sky-strip {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 10px;
      margin-top: 16px; padding: 14px 16px;
      background: rgba(255,255,255,0.16); border-radius: 12px;
    }
    .sky-strip .sky-item { text-align: center; }
    .sky-strip .sky-cap { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.8); }
    .sky-strip .sky-val { font-size: 1.05rem; font-weight: 700; color: #fff; margin-top: 2px; }
    .radar { margin-top: 18px; }
    .radar-frame {
      width: 100%; height: 200px; border: 0; border-radius: 12px; display: block;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    /* Timeline (calendar) */
    .timeline { position: relative; margin-left: 6px; padding-left: 22px; }
    .timeline::before {
      content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px;
      width: 2px; background: var(--line);
    }
    .tl-item { position: relative; padding: 9px 0; }
    .tl-item::before {
      content: ""; position: absolute; left: -22px; top: 15px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .tl-time { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.3px; }
    .tl-title { font-size: 0.98rem; color: var(--ink); }

    /* Stacked stats (Gmail) */
    .stat { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .stat:last-child { border-bottom: none; }
    .stat-num { font-size: 2.2rem; font-weight: 800; color: var(--ink); line-height: 1; }
    .stat-num.hero { font-size: 2.9rem; color: var(--accent); }
    .stat-cap { font-size: 0.85rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

    /* Reminders */
    .reminder-group { margin-bottom: 14px; }
    .reminder-group:last-child { margin-bottom: 0; }
    .reminder-group h3 {
      font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); margin-bottom: 6px; font-weight: 700;
    }
    .reminder-item { padding: 5px 0; font-size: 0.95rem; color: var(--ink-soft); display: flex; gap: 9px; }
    .reminder-item::before { content: "•"; color: var(--accent); font-weight: bold; }

    /* Apollo sequences (progress bars) */
    .seq { margin-bottom: 14px; }
    .seq-head { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
    .seq-name { color: var(--ink); font-weight: 600; }
    .seq-pct { color: var(--accent); font-weight: 700; }
    .seq-bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
    .seq-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 99px; }
    .apollo-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .apollo-stats .stat-num { font-size: 1.7rem; }

    /* Status dot */
    .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
    .status-active { background: var(--sage); }
    .status-pending { background: var(--gold); }

    /* Cron jobs */
    .job {
      padding: 12px 14px; background: var(--card-soft); border: 1px solid var(--line);
      border-left: 3px solid var(--sage); border-radius: 10px; margin-bottom: 10px;
    }
    .job-name { font-weight: 700; color: var(--ink); font-size: 0.92rem; }
    .job-schedule { font-size: 0.78rem; color: var(--muted); font-family: monospace; margin: 3px 0; }
    .job-status { display: flex; align-items: center; font-size: 0.78rem; color: var(--sage); gap: 6px; }

    .frequency-breakdown { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    .frequency-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.95rem; }
    .frequency-label { color: var(--ink-soft); }
    .frequency-count { font-weight: 700; color: var(--ink); }

    .muted-note { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }

    .loading { text-align: center; color: var(--ink-soft); padding: 50px; font-size: 1.2rem; }

    @media (max-width: 768px) {
      .app { padding: 28px 18px; }
      .header h1 { font-size: 2rem; }
      .grid { grid-template-columns: 1fr; }
      .apollo-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="dashboard">
      <div class="header">
        <h1>🌅 Good morning, Ryan</h1>
        <div class="timestamp" id="timestamp"></div>
      </div>

      <div id="quote-container"></div>
      <div class="grid" id="grid"></div>
      <div class="loading" id="loading">Loading your dashboard...</div>
    </div>
  </div>

  <script>
    function readableCronExpression(expr) {
      if (!expr) return '';
      const parts = expr.split(' ');
      if (parts.length < 5) return expr;
      if (expr === '0 0 * * *') return 'Daily at midnight';
      if (expr === '0 9 * * *') return 'Daily at 9:00 AM';
      if (expr === '0 9 1 * *') return 'Monthly at 9:00 AM';
      if (expr === '0 9 1 */3 *') return 'Every 3 months at 9:00 AM';
      if (expr === '0 */6 * * *') return 'Every 6 hours';
      if (expr === '0 0 * * 1') return 'Weekly on Monday at midnight';
      if (expr === '0 0 1 * *') return 'Monthly on the 1st at midnight';
      return expr;
    }

    async function loadDashboard() {
      try {
        const response = await fetch('/api/dashboard');
        const data = await response.json();

        document.getElementById('timestamp').textContent =
          new Date(data.timestamp).toLocaleString('en-US', {
            weekday: 'long', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });

        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        // Quote banner
        if (data.quote) {
          const qc = document.getElementById('quote-container');
          qc.innerHTML = '';
          const card = document.createElement('div');
          card.className = 'quote-card';
          card.innerHTML = `
            <div class="quote-text">"${data.quote.text}"</div>
            <div class="quote-author">— ${data.quote.author}</div>
          `;
          qc.appendChild(card);
        }

        // Weather (hero)
        if (data.weather && !data.weather.error) {
          const w = document.createElement('section');
          w.className = 'card weather-card';
          w.innerHTML = `
            <h2>🌤️ Weather</h2>
            <div class="weather">
              <div class="temp">${Math.round(data.weather.temp)}°F</div>
              <div class="condition">${data.weather.condition}</div>
              <div class="details">
                <p>Feels like ${Math.round(data.weather.feelsLike)}°F</p>
                <p>Humidity ${data.weather.humidity}%</p>
                <p>Wind ${Math.round(data.weather.windSpeed)} mph</p>
              </div>
              ${(data.weather.high != null || data.weather.sunrise) ? `
              <div class="sky-strip">
                ${data.weather.high != null ? `<div class="sky-item"><div class="sky-cap">High / Low</div><div class="sky-val">${data.weather.high}° / ${data.weather.low}°</div></div>` : ''}
                ${data.weather.sunrise ? `<div class="sky-item"><div class="sky-cap">🌅 Sunrise</div><div class="sky-val">${data.weather.sunrise}</div></div>` : ''}
                ${data.weather.sunset ? `<div class="sky-item"><div class="sky-cap">🌇 Sunset</div><div class="sky-val">${data.weather.sunset}</div></div>` : ''}
                ${data.weather.rainChance != null ? `<div class="sky-item"><div class="sky-cap">☔ Rain</div><div class="sky-val">${data.weather.rainChance}%</div></div>` : ''}
              </div>` : ''}
              <div class="radar">
                <iframe class="radar-frame" title="Local doppler radar" loading="lazy"
                  src="https://www.rainviewer.com/map.html?loc=40.8351,-74.1745,8&oFa=0&oC=0&oU=0&oCS=1&oF=0&c=3&o=83&lm=1&layer=radar&sm=1&sn=1&hu=false"></iframe>
              </div>
            </div>
          `;
          grid.appendChild(w);
        }

        // Calendar (timeline)
        if (data.calendar) {
          const c = document.createElement('section');
          c.className = 'card';
          const events = data.calendar.events || [];
          const calMsg = data.calendar.message
            || (data.calendar.status === 'connected' ? 'No events today' : '⏳ Connecting...');
          c.innerHTML = `
            <h2>📅 Today's Schedule</h2>
            ${events.length > 0
              ? `<div class="timeline">${events.map(e => `
                  <div class="tl-item">
                    <div class="tl-time">${e.start || e.time || ''}</div>
                    <div class="tl-title">${e.summary || e.title}</div>
                  </div>`).join('')}</div>`
              : `<div class="reminder-item" style="color: var(--muted);">${calMsg}</div>`}
          `;
          grid.appendChild(c);
        }

        // Card My Yard
        if (data.cmyWatcher && !data.cmyWatcher.error) {
          const m = data.cmyWatcher;
          const c = document.createElement('section');
          c.className = 'card';
          c.innerHTML = `
            <h2>📦 Card My Yard</h2>
            <div class="metric"><div class="label">Orders Today</div><div class="value accent">${m.ordersToday || 0}</div></div>
            <div class="metric"><div class="label">Accepted</div><div class="value accent">${m.acceptedToday || 0}</div></div>
            <div class="frequency-breakdown">
              <div class="frequency-row"><span class="frequency-label">Daily</span><span class="frequency-count">${m.daily || 0}</span></div>
              <div class="frequency-row"><span class="frequency-label">Weekly</span><span class="frequency-count">${m.weekly || 0}${m.weeklyTotal ? ` (${m.weeklyTotal} total)` : ''}</span></div>
              <div class="frequency-row"><span class="frequency-label">Monthly</span><span class="frequency-count">${m.monthly || 0}${m.monthlyTotal ? ` (${m.monthlyTotal} total)` : ''}</span></div>
            </div>
            <div class="metric"><div class="label">Status</div><div class="value small"><span class="status-indicator status-active"></span>Active</div></div>
          `;
          grid.appendChild(c);
        }

        // Reminders (single card, three groups)
        if (data.reminders) {
          const groups = [
            ['Bio-One', data.reminders.bioOne],
            ['Card My Yard', data.reminders.cmy],
            ['Personal', data.reminders.personal],
          ];
          const c = document.createElement('section');
          c.className = 'card';
          c.innerHTML = `
            <h2>🎯 Reminders</h2>
            ${groups.map(([name, items]) => `
              <div class="reminder-group">
                <h3>${name}</h3>
                ${(items && items.length > 0)
                  ? items.map(r => `<div class="reminder-item">${r.title}</div>`).join('')
                  : '<div class="reminder-item" style="color: var(--muted);">No reminders</div>'}
              </div>
            `).join('')}
          `;
          grid.appendChild(c);
        }

        // Gmail (big numbers)
        if (data.email) {
          const isConnected = data.email.status === 'connected';
          const statusLabel = isConnected ? 'Connected'
            : data.email.status === 'not_configured' ? 'Not configured'
            : data.email.status === 'error' ? 'Error' : 'Connecting...';
          const labels = data.email.labels || [];
          const g = document.createElement('section');
          g.className = 'card';
          g.innerHTML = `
            <h2>📧 Gmail Inbox</h2>
            <div class="stat">
              <div class="stat-num hero">${isConnected ? (data.email.unread || 0) : '—'}</div>
              <div class="stat-cap">Total Unread</div>
            </div>
            ${isConnected && labels.length > 0
              ? labels.map(l => `
                  <div class="stat">
                    <div class="stat-num">${l.unread}</div>
                    <div class="stat-cap">${l.missing ? '⚠️ ' : ''}${l.name}</div>
                  </div>`).join('')
              : ''}
            ${!isConnected ? `<div class="metric"><div class="label">Status</div><div class="value small"><span class="status-indicator status-pending"></span>${statusLabel}</div></div>` : ''}
            ${data.email.message ? `<div class="muted-note">${data.email.message}</div>` : ''}
          `;
          grid.appendChild(g);
        }

        // Cron Jobs (sits to the right of Gmail)
        if (data.cronStatus) {
          const c = document.createElement('section');
          c.className = 'card';
          c.innerHTML = `
            <h2>⚙️ Cron Jobs</h2>
            ${data.cronStatus.jobs && data.cronStatus.jobs.length > 0
              ? data.cronStatus.jobs.map(job => `
                  <div class="job">
                    <div class="job-name">${job.name}</div>
                    <div class="job-schedule">${readableCronExpression(job.schedule && job.schedule.expr ? job.schedule.expr : job.schedule)}</div>
                    <div class="job-status">
                      <span class="status-indicator ${job.status === 'active' ? 'status-active' : 'status-pending'}"></span>
                      ${job.status === 'active' ? '✅ Active' : '⏳ ' + job.status}
                    </div>
                  </div>`).join('')
              : '<div style="color: var(--muted); padding: 8px 0;">No active jobs</div>'}
          `;
          grid.appendChild(c);
        }

        // Apollo (progress bars, full width)
        if (data.apollo) {
          const a = data.apollo;
          const connected = a.status === 'connected';
          const card = document.createElement('section');
          card.className = 'card span-all';
          if (connected) {
            card.innerHTML = `
              <h2>🚀 Apollo Outreach</h2>
              ${(a.sequences || []).map(s => `
                <div class="seq">
                  <div class="seq-head">
                    <span class="seq-name">${s.poorly ? '⚠️ ' : ''}${s.name}</span>
                    <span class="seq-pct">${s.openRate}% open</span>
                  </div>
                  <div class="seq-bar"><div class="seq-fill" style="width: ${Math.min(100, s.openRate)}%"></div></div>
                </div>`).join('') || '<div style="color: var(--muted);">No active sequences</div>'}
              <div class="apollo-stats">
                <div><div class="stat-num accent">${a.activeCount || 0}</div><div class="stat-cap">Active</div></div>
                <div><div class="stat-num">${a.totalDelivered || 0}</div><div class="stat-cap">Delivered</div></div>
                <div><div class="stat-num">${a.totalOpened || 0}</div><div class="stat-cap">Opened</div></div>
                <div><div class="stat-num">${a.totalReplied || 0}</div><div class="stat-cap">Replied</div></div>
              </div>
            `;
          } else {
            card.innerHTML = `
              <h2>🚀 Apollo Outreach</h2>
              <div class="metric"><div class="label">Status</div><div class="value small"><span class="status-indicator status-pending"></span>${a.status === 'not_configured' ? 'Not configured' : a.status === 'error' ? 'Error' : 'Initializing...'}</div></div>
              ${a.message ? `<div class="muted-note">${a.message}</div>` : ''}
            `;
          }
          grid.appendChild(card);
        }

      } catch (error) {
        console.error('Dashboard error:', error);
        document.getElementById('loading').innerHTML = '❌ Error loading dashboard. Check console.';
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
